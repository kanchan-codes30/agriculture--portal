<!DOCTYPE html>
<html>
<head>
<title>Prediction</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card p-4 shadow">

<h3 class="mb-3">🌱 Crop Prediction</h3>

<form method="POST">

<input class="form-control mb-2" name="N" placeholder="Nitrogen" required>
<input class="form-control mb-2" name="P" placeholder="Phosphorus" required>
<input class="form-control mb-2" name="K" placeholder="Potassium" required>
<input class="form-control mb-2" name="temp" placeholder="Temperature" required>
<input class="form-control mb-2" name="humidity" placeholder="Humidity" required>
<input class="form-control mb-2" name="ph" placeholder="pH" required>
<input class="form-control mb-3" name="rainfall" placeholder="Rainfall" required>

<button class="btn btn-success w-100">Predict</button>

</form>

</div>
</div>

</body>
</html>
