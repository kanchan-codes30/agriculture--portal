<!DOCTYPE html>
<html>
<head>
<title>News</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>📰 Agriculture News</h2>

<div id="news">Loading news...</div>

</div>

<script>
fetch("https://gnews.io/api/v4/search?q=agriculture&lang=en&token=cf11c8af234fff1e6af16d61c028eb3b")
.then(res => res.json())
.then(data => {

    let html = "";

    if(data.articles && data.articles.length > 0){
        data.articles.forEach(n => {
            html += `
            <div class="card p-3 mb-3 shadow">
                <h5>${n.title}</h5>
                <p>${n.description || ""}</p>
                <a href="${n.url}" target="_blank">Read more</a>
            </div>`;
        });
    } else {
        html = "<p>No news available 😢</p>";
    }

    document.getElementById("news").innerHTML = html;
})
.catch(error => {
    document.getElementById("news").innerHTML =
        "⚠️ Error loading news (API limit ya internet issue)";
});
</script>

</body>
</html>
