<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right,#43cea2,#185a9d);">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🌾 Smart Agriculture System</span>
    <a href="/logout" class="btn btn-light btn-sm">Logout</a>
</nav>

<div class="container mt-5 text-center">

<h2 class="text-white">👋 Welcome {{session['user']}}</h2>
<p class="text-light">Smart Farming Dashboard</p>

<div class="row mt-4">

<!-- 🌱 Prediction -->
<div class="col-md-4">
<div class="card p-4 shadow">
    <h4>🌱 Prediction</h4>
    <p>AI crop suggestion</p>
    <a href="/predict" class="btn btn-success">Start</a>
</div>
</div>

<!-- 📊 History -->
<div class="col-md-4">
<div class="card p-4 shadow">
    <h4>📊 History</h4>
    <p>View previous records</p>
    <a href="/history" class="btn btn-warning">Open</a>
</div>
</div>

<!-- 🌦 Weather -->
<div class="col-md-4">
<div class="card p-4 shadow">
    <h4>🌦 Weather</h4>
    <p>Live weather updates</p>
    <a href="/weather" class="btn btn-primary">Check</a>
</div>
</div>

<!-- 📈 Graph -->
<div class="col-md-4 mt-4">
<div class="card p-4 shadow">
    <h4>📈 Graph</h4>
    <p>Crop analysis</p>
    <a href="/graph" class="btn btn-info">View</a>
</div>
</div>

<!-- 📰 News -->
<div class="col-md-4 mt-4">
<div class="card p-4 shadow">
    <h4>📰 News</h4>
    <p>Latest agriculture news</p>
    <a href="/news" class="btn btn-dark">Read</a>
</div>
</div>

</div>

</div>

</body>
</html>
